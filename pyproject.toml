[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomato-disease-classifier"
version = "0.1.0"
description = "Scientifically honest tomato leaf disease classification with MobileNetV3 and locked evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16.0",
    "keras>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "Pillow>=10.0.0",
    "ImageHash>=4.3.0",
    "PyYAML>=6.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
